# HOSPO OPS — self-hosted hospitality operations platform
# (Next.js admin + worker app + PostgreSQL 16).
#
# The app image is built by GitHub Actions and published to GHCR, so Portainer
# just PULLS it. Deploy as a Stack in Portainer (Stacks → Add stack → Repository),
# set the compose path to "docker-compose.yml", and set these under
# "Environment variables":
#   DB_PASSWORD             (required)  the database password you choose
#   NEXTAUTH_SECRET         (required)  admin login signing secret — openssl rand -base64 32
#   WORKER_SESSION_SECRET   (required)  worker PIN session secret  — openssl rand -base64 32
#   APP_URL                 (required)  the ONE public URL you reach the app at.
#                                       Used for admin login (NextAuth) AND baked
#                                       into scannable QR codes. Include the port
#                                       if not 80/443, e.g. http://192.168.1.100:9008
#                                       Behind Cloudflare Tunnel use the https
#                                       hostname, e.g. https://hospo.example.com
#   APP_PORT                (optional)  host port the app is published on (default 3000)
#   APP_NAME                (optional)  display / white-label name (default "HOSPO OPS")
#   DB_USER                 (optional)  database username (default hospo_ops_user)
#   CRON_SECRET             (optional)  bearer token for the cron endpoints
#                                       (WooCommerce product sync + expiry scan)
#   IMAGE_TAG               (optional)  Docker image tag to pull (default latest,
#                                       or set to develop for the latest fixes)
#
# On first start the app container regenerates the Prisma client, reconciles the
# DB schema (`prisma db push`), and seeds the demo data (1 venue, departments,
# logins, example tasks + QR codes). All steps are idempotent — redeploys won't
# duplicate anything.
#
# Default logins after first deploy (CHANGE THESE in Settings):
#   Admin/manager web login (email + password):
#     admin@demo.com / admin1234    bar@demo.com / bar1234
#     kitchen@demo.com / kitchen1234  foh@demo.com / foh1234
#   Floor worker login (QR + PIN):  0000 · 1111 · 2222 · 3333

services:
  db:
    image: postgres:16-alpine
    container_name: hospo-ops-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hospo_ops
      POSTGRES_USER: ${DB_USER:-hospo_ops_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in Portainer env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hospo_ops_user} -d hospo_ops"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/smartcile/heavens-hospo-helper:${IMAGE_TAG:-latest}
    container_name: hospo-ops-app
    restart: unless-stopped
    pull_policy: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      # APP_PORT controls the published host port. Container always listens on 3000.
      - "${APP_PORT:-3000}:3000"
    environment:
      # Built from the db settings above; `db` is the service hostname.
      DATABASE_URL: postgresql://${DB_USER:-hospo_ops_user}:${DB_PASSWORD}@db:5432/hospo_ops
      # Admin login (NextAuth). NEXTAUTH_URL is derived from APP_URL so you only
      # ever set one public URL for the whole app.
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in Portainer env}
      NEXTAUTH_URL: ${APP_URL:?set APP_URL in Portainer env}
      # Worker PIN session — separate secret, signs the worker JWT cookie.
      WORKER_SESSION_SECRET: ${WORKER_SESSION_SECRET:?set WORKER_SESSION_SECRET in Portainer env}
      WORKER_SESSION_EXPIRY_MINUTES: ${WORKER_SESSION_EXPIRY_MINUTES:-15}
      # The single public URL — also baked into scannable QR codes.
      APP_URL: ${APP_URL:?set APP_URL in Portainer env}
      # White-label display name, exposed to both server and client.
      APP_NAME: ${APP_NAME:-HOSPO OPS}
      NEXT_PUBLIC_APP_NAME: ${APP_NAME:-HOSPO OPS}
      NEXT_PUBLIC_WORKER_SESSION_EXPIRY_MINUTES: ${WORKER_SESSION_EXPIRY_MINUTES:-15}
      # Phase 1: uploaded task photos are stored on the local volume below.
      UPLOAD_PROVIDER: local
      UPLOAD_PATH: /app/uploads
      # Cron job authentication for product sync and expiry scan.
      CRON_SECRET: ${CRON_SECRET:-}
    volumes:
      # Task completion photos persist here across redeploys.
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
