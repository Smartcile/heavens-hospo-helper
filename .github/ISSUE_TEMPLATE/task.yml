name: Task
description: A HOSPO OPS fix or feature request
title: "[AREA] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of HOSPO OPS does this touch?
      options:
        - Availability
        - Tasks and Lists
        - Guides
        - Roster
        - Bookings
        - Orders
        - Inventory
        - Events and BEO
        - SwiftPOS
        - UI and mobile
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
      description: Describe the current behaviour and why it is a problem.
      placeholder: When I open the approvals area...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should happen?
      description: Describe the expected behaviour as if you were using it.
      placeholder: I should be able to click a person and see...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true for this to be done?
      placeholder: |
        - [ ] The approvals area lists people, not every request.
        - [ ] Clicking a person opens the same editor used elsewhere.
        - [ ] Existing approvals are not overwritten silently.
    validations:
      required: true

  - type: dropdown
    id: db_impact
    attributes:
      label: Database or schema impact
      options:
        - "No"
        - "Yes - schema change"
        - "Not sure"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low
        - Medium
        - High
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Screenshots, links, or extra context
      description: Paste screenshots, page paths, or related issues.
      placeholder: Admin -> Team -> Availability...
    validations:
      required: false

  - type: dropdown
    id: screenshot_needed
    attributes:
      label: Screenshot before merge?
      description: Choose Yes when you want the agent to post a visual check.
      options:
        - "No"
        - "Yes"
        - "Only if the UI changes"
    validations:
      required: true

  - type: input
    id: screenshot_path
    attributes:
      label: Page to screenshot
      description: The page path the agent should capture.
      placeholder: /admin/team?tab=availability
    validations:
      required: false

  - type: dropdown
    id: screenshot_role
    attributes:
      label: Screenshot login
      options:
        - Public
        - Admin
        - Worker
    validations:
      required: false
