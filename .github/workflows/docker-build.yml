name: Build and publish image

# Builds the HOSPO OPS app image and pushes it to the GitHub Container
# Registry (GHCR) so Portainer can just PULL it - no building on your server.
#
# Automatic:
#   - push to develop  -> builds the checks and pushes the :develop image
#   - push to main     -> builds the checks and pushes :latest (+ :main)
#   - push a v* tag    -> pushes the semver image
# Manual:
#   Actions -> Build and publish image -> Run workflow
#
# Pull requests are validated by ci.yml (lint, type-check, tests, Next build);
# this workflow does the Docker build and push on the integration branches.
# scripts/agent/publish.ps1 remains a local fallback only.
#
# Deferred speedup (4a): shard Vitest across parallel jobs. Ask before adding.

on:
  push:
    branches: [develop, main]
    tags: ['v*']
  workflow_dispatch: {} # lets you trigger a build manually from the Actions tab

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # ghcr.io/smartcile/heavens-hospo-helper

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/db

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          # The package denies GITHUB_TOKEN writes (write_package), so use a
          # package-write token. Fall back to GITHUB_TOKEN only when absent.
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      # Run lint/type-check/tests in the background while the image builds. The
      # image is only pushed when both the build and the checks succeed, so a
      # failing test still blocks the registry tag.
      - name: Run checks and build image
        run: |
          set -euo pipefail

          ( npm run lint && npm run type-check && npm run test ) > /tmp/checks.log 2>&1 &
          checks_pid=$!
          trap 'kill "$checks_pid" 2>/dev/null || true' EXIT

          mapfile -t tag_values <<< "${{ steps.meta.outputs.tags }}"
          tag_args=()
          for tag in "${tag_values[@]}"; do
            [ -n "$tag" ] && tag_args+=(-t "$tag")
          done

          docker buildx build "${tag_args[@]}" --load \
            -f apps/web/Dockerfile \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --provenance=false \
            --sbom=false \
            .

          if ! wait "$checks_pid"; then
            echo "=== CHECKS: FAILED ==="
            tail -n 500 /tmp/checks.log
            exit 1
          fi
          echo "=== CHECKS: PASSED ==="
          tail -n 40 /tmp/checks.log

          for tag in "${tag_values[@]}"; do
            [ -n "$tag" ] && docker push "$tag"
          done
