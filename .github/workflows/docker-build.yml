name: Build and publish image

# Builds the HOSPO OPS app image and pushes it to the GitHub Container
# Registry (GHCR) so Portainer can just PULL it — no building on your server.
#
# Automatic:
#   - push to develop  -> builds the checks and pushes the :develop image
#   - push to main     -> builds the checks and pushes :latest (+ :main)
#   - push a v* tag    -> pushes the semver image
# Manual:
#   Actions -> Build and publish image -> Run workflow
#
# Pull requests are validated by ci.yml (lint, type-check, tests, Next build);
# this workflow does the Docker build and push on the integration branches.
# scripts/agent/publish.ps1 remains a local fallback only.

on:
  push:
    branches: [develop, main]
    tags: ['v*']
  workflow_dispatch: {} # lets you trigger a build manually from the Actions tab

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # ghcr.io/smartcile/heavens-hospo-helper

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/db

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
