name: CI

# The pull-request gate. Everything (lint, type-check, tests and the Next.js
# production build) runs here, in GitHub Actions — not on the developer machine.
# Image builds run in docker-build.yml when a branch is pushed to develop/main
# or a v* tag is pushed.

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch: {} # lets you trigger a check manually from the Actions tab

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/db

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
