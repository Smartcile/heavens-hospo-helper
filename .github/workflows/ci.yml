name: CI

# Manual check. Lint, type-check, the full test suite and the Next.js
# production build run here only when triggered by hand (Actions tab, or
# `gh workflow run ci.yml --ref <branch>`). Pull requests do NOT run this
# automatically - local checks via scripts/agent/check.ps1 are the gate.
# Image builds run in docker-build.yml when a branch is pushed to develop/main
# or a v* tag is pushed, and that job still runs lint/type-check/tests
# before it publishes an image.

on:
  workflow_dispatch: {} # manual only - no automatic pull-request runs

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/db

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
