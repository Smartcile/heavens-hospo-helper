name: CI

# Manual-only by default. The local gate is scripts/agent/check.ps1; this
# workflow is the on-request cloud fallback (Actions -> CI -> Run workflow).
# To request a run, pick the branch in the Actions tab.

on:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/db

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx turbo run test
